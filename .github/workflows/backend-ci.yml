# Backend CI — runs on EVERY PR/push, regardless of what changed.
# Owner: P1 (Backend/Orchestration Lead), maintained jointly with P6 (QA/Integration Lead).
#
# Deliberately NOT path-filtered: this job (lint-and-test) is a required
# status check in branch protection. A path filter here means a PR that
# doesn't touch src/backend never gets this check to report at all, which
# GitHub treats as permanently pending rather than passing — branch
# protection then blocks the merge forever (discovered via PR #19, a
# backend-only change that got stuck on frontend-ci's required check never
# running). Path filters and "required status check" don't mix safely
# unless every required check is guaranteed to run on every PR — so this
# workflow now always runs. ~30s of CI time is a fine trade for a merge
# queue that isn't permanently stuck.
name: backend-ci

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: src/backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: src/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest --maxfail=1 -q

      # TODO(P1/P6): once app/db is implemented, add a postgis service
      # container here (image: postgis/postgis:16-3.4) and run schema.sql
      # against it for a real integration test pass, rather than mocking DB
      # access in unit tests only.
