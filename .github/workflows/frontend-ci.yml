# Frontend CI — runs on EVERY PR/push, regardless of what changed.
# Owner: P6 (Frontend Engineer, Map/Trace + QA/Integration Lead).
#
# Deliberately NOT path-filtered — see backend-ci.yml's comment for why:
# lint-build-test is a required branch-protection status check, and a path
# filter means it silently never reports (permanently "pending", not
# "passing") on a PR that doesn't touch src/frontend, which blocks merge
# forever. Discovered via PR #19.
name: frontend-ci

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: src/frontend

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build

      - name: Test
        run: npm run test -- --run
