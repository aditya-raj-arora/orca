# Frontend CI — runs on every PR/push touching src/frontend.
# Owner: P6 (Frontend Engineer, Map/Trace + QA/Integration Lead).
name: frontend-ci

on:
  pull_request:
    paths:
      - "src/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/frontend/**"

defaults:
  run:
    working-directory: src/frontend

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build

      - name: Test
        run: npm run test -- --run
