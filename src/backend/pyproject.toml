[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # Real LLM + real external APIs. Skipped unless ORCA_RUN_LIVE_TESTS=1 —
    # see tests/integration/test_live_e2e.py for why it is opt-in.
    "live: end-to-end test against live external services (issue #36)",
]
